# Masked reconstruction on whole songs. No IPA or lyric targets are read.
data:
  prepared_dir: ../data/dali-xai

model:
  melody_initialization: random
  melody_encoder:
    d_model: 256
    num_layers: 4
    num_heads: 4
    dim_feedforward: 1024
    dropout: 0.1
    pooling: cls
    max_length: 2048
  max_song_notes: 2048
  max_song_lines: 256

training:
  output_dir: ../checkpoints/bridge-pretrain
  device: cuda
  seed: 1234
  epochs: 100
  batch_size: 8
  num_workers: 0
  precision: bf16
  gradient_accumulation_steps: 2
  mask_probability: 0.15 # Keep only the song's first note as its pitch reference.
  learning_rate: 0.0001
  adam_betas: [0.9, 0.98]
  adam_epsilon: 0.00001
  weight_decay: 0.01
  warmup_steps: 100
  schedule: constant_after_warmup
  gradient_clip: 1.0
  patience: 10
