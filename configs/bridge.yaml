# All paths are relative to this YAML. The XAI lyric checkpoint is used only at inference.
data:
  dali_dir: ../../DALI_v2
  prepared_dir: ../data/dali-xai
  language: english
  song_ids_file: null
  min_ncc: 0.0
  max_syllables: 40
  valid_fraction: 0.1
  test_fraction: 0.1
  seed: 1234
  stress_source: ipa
  prosody_mode: actual # Preserve XAI primary/secondary stress and long-vowel rules.
  include_melody: true
  # Preparation puts contrastive-trained identity groups in downstream train;
  # upstream val/test songs otherwise retain downstream random assignments.
  # Inspect early with: python -m prosodia_lyricist.prepare --config ... --check-splits
  # With warning mode, it may be changed or unavailable when reusing prepared data.
  pretraining_manifest: ../../try-contrastive/data/max_en_2line_16s/segments_manifest.csv
  lines_per_window: 2 # Pretrained tower's window size; retain existing prepared data.

model:
  conditioning: bridge
  melody_initialization: pretrained # random never opens melody_checkpoint.
  # Current note-based two-pool contrastive checkpoint (same format as prosodia-direct).
  melody_checkpoint: ../../try-contrastive/checkpoints/large_2line_16s/best.pt
  # Only used for random initialization; choose the tower size for the comparison.
  random_melody_encoder:
    d_model: 256
    num_layers: 4
    num_heads: 4
    dim_feedforward: 1024
    dropout: 0.1
    pooling: cls
    max_length: 4096
  bridge_scope: song
  query_mode: note # Two shared classification heads after the bidirectional song encoder.
  alignment_policy: strict # Mask mismatched words; prefix optionally pairs min(sung, IPA).
  encoder_lines_per_window: 2 # Must match data.lines_per_window and pretraining.
  max_window_notes: 512
  max_song_notes: 2048
  max_song_lines: 256
  max_target_length: 4096 # Includes fixed line prefixes. Skip whole songs; never truncate.
  song_encoder_layers: 2
  song_encoder: # Width/attention/FFN settings for the song encoder; no query readout.
    d_model: 256
    num_heads: 4
    dim_feedforward: 1024
    dropout: 0.1

training:
  # strict retains the preparation-time CSV requirement; warning permits reuse
  # with a changed/missing CSV and records the current audit status in run.json.
  pretraining_audit_mode: strict
  output_dir: ../checkpoints/bridge-xai
  device: cuda
  seed: 1234
  epochs: 100
  batch_size: 8 # Songs per batch (each song includes all of its encoder windows).
  num_workers: 0
  precision: bf16 #fp32 bf16 is also supported on CUDA hardware with BF16 support.
  gradient_accumulation_steps: 2
  # Zero-based: 1 warms up the song encoder/heads, then fine-tunes the trunk.
  # null keeps the pretrained trunk frozen; 0 fine-tunes immediately.
  # Also applies to a random tower; use 0 to train it from the first epoch.
  melody_unfreeze_epoch: 1
  learning_rate: 0.0001
  melody_learning_rate: 0.000002
  adam_betas: [0.9, 0.98]
  adam_epsilon: 0.00001
  weight_decay: 0.01
  warmup_steps: 100
  schedule: constant_after_warmup
  gradient_clip: 1.0
  patience: 5
