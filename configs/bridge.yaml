# All paths are relative to this YAML. Keep the existing template data/checkpoint.
data:
  dali_dir: ../../DALI_v2
  prepared_dir: ../data/dali-bridge
  language: english
  song_ids_file: null
  min_ncc: 0.0
  max_syllables: 40
  valid_fraction: 0.1
  test_fraction: 0.1
  seed: 1234
  stress_source: ipa
  include_melody: true
  # Set BEFORE preparation to the original CSV used for contrastive training.
  pretraining_manifest: ../../try-contrastive/600_2line_window12/segments_manifest.csv
  lines_per_window: 2 # Must match that manifest; final shorter window is retained.

model:
  conditioning: bridge
  # Current note-based two-pool contrastive checkpoint (same format as prosodia-direct).
  melody_checkpoint: ../../try-contrastive/checkpoints/600_2line_window12/22Sep_1mig/best.pt
  max_notes: 512 # Skip overlong windows, never truncate.
  bridge_decoder:
    d_model: 256
    num_layers: 2
    num_heads: 4
    dim_feedforward: 1024
    dropout: 0.1

training:
  output_dir: ../checkpoints/bridge
  device: auto
  seed: 1234
  epochs: 100
  batch_size: 16
  num_workers: 0
  precision: bf16 #fp32 bf16 is also supported on CUDA hardware with BF16 support.
  gradient_accumulation_steps: 1
  # Zero-based: 1 warms up the new decoder for one epoch, then fine-tunes the trunk.
  # null keeps the pretrained trunk frozen; 0 fine-tunes immediately.
  melody_unfreeze_epoch: 1
  learning_rate: 0.0001
  melody_learning_rate: 0.000002
  adam_betas: [0.9, 0.98]
  adam_epsilon: 0.00001
  weight_decay: 0.01
  warmup_steps: 100
  schedule: constant_after_warmup
  gradient_clip: 1.0
  patience: 5
