# Paths are relative to this YAML. BART/XAI is used only at inference.
data:
  dali_dir: ../../DALI_v2
  prepared_dir: ../data/dali-xai
  language: english
  song_ids_file: null
  min_ncc: 0.0
  max_syllables: 40
  valid_fraction: 0.1
  test_fraction: 0.1
  seed: 1234
  stress_source: ipa
  prosody_mode: actual
  include_melody: true
  # Set the contrastive training CSV before preparation if fusion will be used.
  pretraining_manifest: null

model:
  conditioning: bridge
  melody_initialization: random # random, masked (encoder), or bridge (fine-tune).
  melody_checkpoint: null # best/ directory for masked or bridge initialization.
  melody_encoder:
    d_model: 256
    num_layers: 4
    num_heads: 4
    dim_feedforward: 1024
    dropout: 0.1
    pooling: cls
    max_length: 2048
  max_song_notes: 2048 # Entire songs are skipped/rejected above limits; never truncated.
  max_song_lines: 256
  max_target_length: 4096
  alignment_policy: strict # prefix pairs min(sung, IPA) within mismatched words.
  meter_conditioning: false # Enable for fine-tuning on explicitly annotated meter.
  # Optional whole-song contextual branch; independent of the main encoder.
  # On a fused bridge fine-tune, omit checkpoint to keep its saved tower.
  contrastive_fusion:
    checkpoint: null # ../../try-contrastive/checkpoints/large_2line_16s/best.pt
    unfreeze_epoch: null # Frozen by default; 0 fine-tunes immediately.
    learning_rate: 0.000002

training:
  pretraining_audit_mode: strict
  output_dir: ../checkpoints/bridge-xai
  device: cuda
  seed: 1234
  epochs: 100
  batch_size: 8 # Full songs; attention memory scales quadratically with note count.
  num_workers: 0
  precision: bf16 # Use fp32 on CPU/MPS.
  gradient_accumulation_steps: 2
  melody_unfreeze_epoch: 0 # Train global encoder immediately; null keeps it frozen.
  learning_rate: 0.0001 # Heads, phrase embeddings, meter/fusion adapters.
  melody_learning_rate: 0.0001 # Main global encoder.
  length_class_weights: null # Optional [long, short], e.g. [2.0, 1.0].
  adam_betas: [0.9, 0.98]
  adam_epsilon: 0.00001
  weight_decay: 0.01
  warmup_steps: 100
  schedule: constant_after_warmup
  gradient_clip: 1.0
  patience: 5
