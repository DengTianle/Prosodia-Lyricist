# Relative paths are resolved from this file's directory.
data:
  dali_dir: ../DALI_v2
  prepared_dir: ../data/dali
  language: english
  song_ids_file: null # Optional .txt file, one exact DALI song ID per line.
  min_ncc: 0.0
  max_syllables: 40 # Per line; examples contain complete songs.
  valid_fraction: 0.1
  test_fraction: 0.1
  seed: 1234
  # ipa: original prosodic stress AND vowel length/count; lexical/unknown:
  # alternative DALI sung counts and duration lengths.
  stress_source: ipa

model:
  pretrained: facebook/bart-base
  decoder_mode: explainable
  dropout: 0.3
  transformer_dropout: 0.3
  max_source_length: 1024 # Whole song, including title, prompts, separators and BOS/EOS.
  max_target_length: 1024

training:
  output_dir: ../checkpoints/dali
  device: auto
  seed: 1234
  epochs: 1000
  batch_size: 4
  num_workers: 0
  fixed_batch_order: true
  learning_rate: 0.00005
  adam_betas: [0.9, 0.98]
  adam_epsilon: 0.00001
  weight_decay: 0.0
  warmup_steps: 2500
  # Continue learning after warmup; the partial repository used a broken -1 schedule.
  schedule: constant_after_warmup
  gradient_clip: null
  loss_aggregation: batches
  patience: 5
  # Paper Eq. (1): equal-weight sum of four cross-entropies.
  loss_weights:
    lyrics: 1.0
    syllables: 1.0
    stresses: 1.0
    lengths: 1.0
