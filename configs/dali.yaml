# Relative paths are resolved from this file's directory.
data:
  dali_dir: ../DALI_v2
  prepared_dir: ../data/dali
  language: english
  min_ncc: 0.0
  max_syllables: 64
  valid_fraction: 0.1
  test_fraction: 0.1
  seed: 1234
  # Lexical stress is a pronunciation proxy, not a DALI beat annotation.
  # Use "unknown" to train with duration and syllable counts only.
  stress_source: lexical

model:
  pretrained: facebook/bart-base
  dropout: 0.1
  max_source_length: 256
  max_target_length: 256

training:
  output_dir: ../checkpoints/dali
  device: auto
  seed: 1234
  epochs: 30
  batch_size: 8
  num_workers: 0
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_ratio: 0.06
  gradient_clip: 1.0
  patience: 5
